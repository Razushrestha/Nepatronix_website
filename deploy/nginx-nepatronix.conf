# /etc/nginx/sites-available/nepatronix
# Symlink: ln -s /etc/nginx/sites-available/nepatronix /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name nepatronix.org www.nepatronix.org 163.47.151.250;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
