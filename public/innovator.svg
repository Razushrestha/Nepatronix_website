<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380">
  <defs>
    <style>
      .orange { fill: none; stroke: #F7941D; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- ── BULB OUTER GLASS ── -->
  <!-- Main round bulb top, transitioning into narrow neck -->
  <path class="orange" stroke-width="5"
    d="M170,28
       C122,28 83,67 83,115
       C83,145 98,170 121,184
       L121,200
       C121,203 124,206 127,206
       L213,206
       C216,206 219,203 219,200
       L219,184
       C242,170 257,145 257,115
       C257,67 218,28 170,28 Z"/>

  <!-- Inner oval shine arc at top of bulb -->
  <path class="orange" stroke-width="3.5"
    d="M138,62 C149,46 191,46 202,62"/>

  <!-- ── SCREW BASE (3 ridges) ── -->
  <rect class="orange" stroke-width="4" rx="3"
    x="121" y="206" width="98" height="14"/>
  <rect class="orange" stroke-width="4" rx="3"
    x="124" y="221" width="92" height="14"/>
  <rect class="orange" stroke-width="4" rx="3"
    x="130" y="236" width="80" height="14"/>

  <!-- ── GEM / DIAMOND INSIDE BULB ── -->
  <!-- Outer diamond outline (pentagon-like cut gem) -->
  <!-- Top triangle -->
  <polyline class="orange" stroke-width="3.5"
    points="170,72  148,104  170,168  192,104  170,72"/>
  <!-- Middle horizontal line -->
  <line class="orange" stroke-width="3.5"
    x1="148" y1="104" x2="192" y2="104"/>
  <!-- Left facet lines from top -->
  <line class="orange" stroke-width="2.5"
    x1="170" y1="72" x2="155" y2="104"/>
  <line class="orange" stroke-width="2.5"
    x1="170" y1="72" x2="185" y2="104"/>
  <!-- Lower facets from middle to bottom point -->
  <line class="orange" stroke-width="2.5"
    x1="155" y1="104" x2="170" y2="168"/>
  <line class="orange" stroke-width="2.5"
    x1="185" y1="104" x2="170" y2="168"/>
  <!-- Inner small triangle top -->
  <polyline class="orange" stroke-width="2"
    points="163,88  170,72  177,88"/>

  <!-- ── TEXT "innovator" ── -->
  <!-- Using individual paths to match the decorative handwritten style -->
  <text
    x="170" y="318"
    text-anchor="middle"
    font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif"
    font-size="42"
    font-style="italic"
    fill="#F7941D"
    letter-spacing="2">innovator</text>

  <!-- Dots above both i's (approximate positions) -->
  <circle cx="102" cy="282" r="4" fill="#F7941D"/>
  <circle cx="131" cy="282" r="4" fill="#F7941D"/>
</svg>
