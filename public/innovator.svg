<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 230" width="200" height="230">
  <!-- Lightbulb outer shape -->
  <path d="M100 20 C65 20, 38 47, 38 82 C38 105, 50 124, 68 135 L68 158 C68 162, 71 165, 75 165 L125 165 C129 165, 132 162, 132 158 L132 135 C150 124, 162 105, 162 82 C162 47, 135 20, 100 20 Z"
    fill="none" stroke="#F7941D" stroke-width="4"/>

  <!-- Screw base lines -->
  <rect x="72" y="165" width="56" height="8" rx="2" fill="none" stroke="#F7941D" stroke-width="3.5"/>
  <rect x="74" y="175" width="52" height="8" rx="2" fill="none" stroke="#F7941D" stroke-width="3.5"/>
  <rect x="78" y="185" width="44" height="8" rx="2" fill="none" stroke="#F7941D" stroke-width="3.5"/>

  <!-- Diamond / gem shape inside bulb -->
  <polygon points="100,55 120,80 100,105 80,80"
    fill="none" stroke="#F7941D" stroke-width="3"/>
  <!-- Diamond facets -->
  <line x1="80" y1="80" x2="100" y2="55" stroke="#F7941D" stroke-width="2"/>
  <line x1="120" y1="80" x2="100" y2="55" stroke="#F7941D" stroke-width="2"/>
  <line x1="80" y1="80" x2="100" y2="105" stroke="#F7941D" stroke-width="2"/>
  <line x1="120" y1="80" x2="100" y2="105" stroke="#F7941D" stroke-width="2"/>
  <line x1="80" y1="80" x2="120" y2="80" stroke="#F7941D" stroke-width="2"/>

  <!-- Circular arc lines around bulb top -->
  <path d="M70 50 Q100 30 130 50" fill="none" stroke="#F7941D" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 42 Q100 18 140 42" fill="none" stroke="#F7941D" stroke-width="2.5" stroke-linecap="round"/>

  <!-- "innovator" text -->
  <text x="100" y="220" text-anchor="middle"
    font-family="Georgia, serif"
    font-size="26"
    fill="#F7941D"
    letter-spacing="1">innovator</text>

  <!-- Dot above first i -->
  <circle cx="51" cy="204" r="2.5" fill="#F7941D"/>
</svg>
